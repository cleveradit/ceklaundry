services:
  qa:
    image: ceklaundry-app
    env_file: .env
    environment:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8089
      DB_HOST: db
      DB_DATABASE: ceklaundry_test
      MAIL_MAILER: array
      SESSION_SECURE_COOKIE: 'false'
    ports:
      - '127.0.0.1:8089:8089'
    command: [php, artisan, serve, '--host=0.0.0.0', '--port=8089', '--no-reload']
    depends_on:
      db:
        condition: service_healthy
